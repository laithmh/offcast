name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g., v1.0.0+1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android Keystore (if secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/offcast-release.jks
            
            cat <<EOF > android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=offcast-release.jks
          EOF
            echo "Keystore and key.properties configured successfully."
          else
            echo "No KEYSTORE_BASE64 secret found. Falling back to default signing config."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run test suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Determine Release Tag & Package Artifacts
        id: prep_release
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          # Copy and rename APK
          cp build/app/outputs/flutter-apk/app-release.apk "offcast-${TAG}.apk"
          
          # Generate SHA-256 checksum
          sha256sum "offcast-${TAG}.apk" > "offcast-${TAG}.apk.sha256"
          
          echo "Packaged offcast-${TAG}.apk and checksum"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_release.outputs.tag }}
          name: "OffCast ${{ steps.prep_release.outputs.tag }}"
          files: |
            offcast-${{ steps.prep_release.outputs.tag }}.apk
            offcast-${{ steps.prep_release.outputs.tag }}.apk.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📡 OffCast Release ${{ steps.prep_release.outputs.tag }}
            
            Ultra-Low Latency Offline Director Monitor & Teleprompter for Mobile Video Creators.
            
            #### 📦 Included Binaries
            - **`offcast-${{ steps.prep_release.outputs.tag }}.apk`**: Android Universal Release APK (ARM64, ARMv7, x86_64).
            - **`offcast-${{ steps.prep_release.outputs.tag }}.apk.sha256`**: SHA-256 verification hash.
            
            #### ⚡ Highlights
            - <20ms Glass-to-Glass Viewfinder Latency over Direct Hotspot.
            - Low-heat 30 FPS MediaCodec hardware silicon H.264 encoding.
            - Real-time on-device Voice Activity Detection (VAD) teleprompter.
            - Social framing guides (9:16 Shorts/Reels/TikTok, 16:9 widescreen, 3x3 grid).
            - In-process native UDP relay bypassing Android SoftAP client isolation.
